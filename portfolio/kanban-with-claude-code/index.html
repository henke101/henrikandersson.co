<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<link rel="icon" type="image/svg+xml" href="/favicon.svg">
<title>Designing and building a kanban board using only Claude Code</title>
<style>

  :root{--ink:#111;--ink-soft:#444;--ink-faint:#767676;}
  *{box-sizing:border-box}
  html{-webkit-text-size-adjust:100%}
  body{margin:0;background:#fff;color:var(--ink);
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",system-ui,sans-serif;
    -webkit-font-smoothing:antialiased;}
  p{margin:0 0 2.45rem}
  ul{list-style:none;margin:0;padding:0}
  li:last-child{margin-bottom:0}
  .item{font-weight:600;font-size:19px;line-height:1.45;display:block}
  .note{display:block;margin-top:.3rem;color:var(--ink-soft)}
  .body-size .item{font-size:inherit}
  figure img{display:block;width:100%;height:auto}
  figcaption{margin-top:.75rem;font-size:.875rem;line-height:1.5;color:var(--ink-faint)}
  .back{font-size:.9375rem;color:var(--ink-soft);
    text-decoration:underline;text-decoration-color:#bbb;
    text-underline-offset:3px;text-decoration-thickness:1px}
  .back:hover{color:var(--ink);text-decoration-color:var(--ink)}

  body{font-size:19px;line-height:1.65}
  .wrap{display:grid;grid-template-columns:17rem minmax(0,44rem);gap:7rem;
    max-width:72rem;margin:0 auto;padding:2rem 32px 9rem}
  aside{position:sticky;top:5.5rem;align-self:start;font-size:.875rem;line-height:1.45}
  .topbar-outer{position:sticky;top:0;z-index:2;background:#fff}
  .topbar{max-width:72rem;margin:0 auto;padding:1.75rem 32px 1.25rem}
  @media (max-width:860px){.topbar{padding:1.25rem 24px 1rem}}
  .meta{margin:0 0 2.5rem}
  .meta div{padding:.5rem 0}
  .meta dt{font-weight:600;color:var(--ink);font-size:1.175rem;margin-bottom:.2rem}
  .meta dd{margin:0;color:var(--ink-soft)}
  nav{display:flex;flex-direction:column;gap:.5rem;
    border-top:1px solid #e0e0e0;padding-top:1.5rem}
  nav a{color:var(--ink-soft);font-size:.875rem;
    text-decoration:underline;text-decoration-color:#bbb;
    text-underline-offset:3px;text-decoration-thickness:1px}
  nav a:hover{color:var(--ink);text-decoration-color:var(--ink)}
  h1{font-size:2.575rem;line-height:1.12;letter-spacing:-.02em;font-weight:700;margin:0 0 1rem}
  .disclosure{color:var(--ink);font-size:1rem;font-weight:700;
    line-height:1.45;margin:0 0 3.5rem}
  .intro{font-size:inherit;line-height:inherit;color:var(--ink-soft);margin:0 0 1.1rem}
  .intro.lead{color:var(--ink);margin-bottom:0}
  h1 + h2{margin-top:4rem}
  h2{font-size:2.25rem;line-height:1.18;letter-spacing:-.015em;font-weight:700;margin:6rem 0 .6rem}
  h3{font-size:1.3rem;line-height:1.3;font-weight:700;margin:3rem 0 .9rem}
  h2 + ul{margin-top:2.4rem}
  li{margin:0 0 1.75rem}
  ul.dots{list-style:disc;padding-left:1.1rem}
  ul.dots li{margin:0 0 1rem}
  ul.dots li::marker{color:var(--ink-faint)}
  ul.plain{list-style:none;padding-left:0}
  ul.plain li{margin:0 0 1.1rem}
  ul.grid-2{display:grid;grid-template-columns:1fr 1fr;gap:1.6rem 3rem;margin-top:0}
  ul.grid-2 li{margin:0}
  ul.big li{font-size:23px;font-weight:600;line-height:1.4}
  ul.grid-2 + ul{margin-top:2rem}
  ul.grid-2 + ul li{margin:0 0 .35rem}
  figure{margin:3.5rem 0}
  @media (min-width:1100px){figure{margin-right:-6rem}}
  @media (max-width:860px){
    .wrap{display:block;padding-top:2.5rem}
    aside{position:static;margin-bottom:3.5rem}
    .wrap{padding:2rem 24px 6rem}
    nav{display:none}
    h1{font-size:2rem}
    h2{font-size:1.625rem}
    ul.grid-2{grid-template-columns:1fr;gap:.9rem}
  }

</style>
</head>
<body>
<div class="topbar-outer"><div class="topbar"><a class="back" href="/portfolio/">Back to work</a></div></div>
<div class="wrap">
  <aside>
    <dl class="meta">
  <div><dt>When</dt><dd></dd></div>
  <div><dt>Role</dt><dd></dd></div>
  <div><dt>Responsibilities</dt><dd></dd></div>
  <div><dt>Teams</dt><dd></dd></div>
</dl>
    <nav>
    <a href="#overview">Overview</a>
    <a href="#problem">Problem</a>
    <a href="#outcome">Outcome</a>
    <a href="#process">Process</a>
    <a href="#decisions">Decisions</a>
    <a href="#differently">What I'd do differently</a>
    </nav>
  </aside>
  <main>
<h1>Designing and building a kanban board using only Claude Code</h1>

<h2 id="overview">Overview</h2>

<h2 id="problem">Problem</h2>

<h2 id="outcome">Outcome</h2>

<h2 id="process">Process</h2>

<h3 id="goals">Goals and scope</h3>

<h3 id="research">Research</h3>

<h3 id="discoveries">Discoveries</h3>

<h2 id="decisions">Decisions</h2>

<h2 id="differently">What I'd do differently today</h2>
  </main>
</div>
</body>
</html>
