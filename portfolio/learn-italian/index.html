<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<link rel="icon" type="image/svg+xml" href="/favicon.svg">
<title>App to learn Italian as a Spanish speaker</title>
<style>

  :root{--ink:#111;--ink-soft:#444;--ink-faint:#767676;}
  *{box-sizing:border-box}
  html{-webkit-text-size-adjust:100%}
  body{margin:0;background:#fff;color:var(--ink);
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",system-ui,sans-serif;
    font-size:19px;line-height:1.65;-webkit-font-smoothing:antialiased;}
  p{margin:0 0 2.45rem}
  .back{font-size:.9375rem;color:var(--ink-soft);
    text-decoration:underline;text-decoration-color:#bbb;
    text-underline-offset:3px;text-decoration-thickness:1px}
  .back:hover{color:var(--ink);text-decoration-color:var(--ink)}
  .topbar-outer{position:sticky;top:0;z-index:2;background:#fff}
  .topbar{max-width:72rem;margin:0 auto;padding:1.75rem 32px 1.25rem}
  /* No sidebar on the side projects: one column, nothing to align against. */
  .wrap{max-width:44rem;margin:0 auto;padding:2rem 32px 9rem}
  h1{font-size:2.575rem;line-height:1.12;letter-spacing:-.02em;font-weight:700;
    margin:0 0 2.5rem}
  .grid{display:grid;grid-template-columns:1fr 1fr;gap:2.5rem 2rem;margin:3.5rem 0}
  figure{margin:0}
  figure img{display:block;width:100%;height:auto}
  /* 47px margin on a 1258px canvas: lines the caption up with the phone. */
  figcaption{margin-top:.75rem;font-size:.875rem;line-height:1.5;
    color:var(--ink-faint);padding-left:3.736%}
  @media (max-width:640px){.grid{grid-template-columns:1fr;gap:2.5rem}}
  @media (max-width:860px){
    .topbar{padding:1.25rem 24px 1rem}
    .wrap{padding:2rem 24px 6rem}
    h1{font-size:2rem}
  }

</style>
</head>
<body>
<div class="topbar-outer"><div class="topbar"><a class="back" href="/portfolio/">Back to portfolio</a></div></div>
<div class="wrap">
  <main>
<h1>App to learn Italian as a Spanish speaker</h1>
<p>An app I built to learn speaking Italian ahead of a vacation there, tailored to me as a Spanish speaker. I designed the exercises backed up by language learning research, and used Claude to perform user interviews on myself.</p>

<div class="grid">
<figure>
  <img src="img/categories.png" alt="The app's menu open, listing its eight sections: sounds, false friends, words, grammar, phrases, listening, practice and review.">
  <figcaption>Eight categories to practice on.</figcaption>
</figure>

<figure>
  <img src="img/false-friends.png" alt="The false friends list: burro, imbarazzata, guardare and largo, each with the Spanish meaning struck through and the Italian one beside it.">
  <figcaption>False friends. Words that have a way different meaning in Italian.</figcaption>
</figure>

<figure>
  <img src="img/exercise.png" alt="A translation exercise: Good night! to be translated, with the correct answer Buonanotte! revealed below.">
  <figcaption>I figured I'd learn more translating from English to Italian than from Italian to English.</figcaption>
</figure>

<figure>
  <img src="img/listening.png" alt="The listening section: topic chips above a card showing burro with its meaning and the false-friend warning, over a player with speed control.">
  <figcaption>Listening exercise. Including a reminder of the false friend.</figcaption>
</figure>
</div>
  </main>
</div>
</body>
</html>
