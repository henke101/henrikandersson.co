<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Henrik Andersson — Portfolio</title>
<link rel="icon" type="image/svg+xml" href="/favicon.svg">
<style>
  :root{--ink:#111;--ink-soft:#444;--ink-faint:#767676}
  *{box-sizing:border-box}
  html{-webkit-text-size-adjust:100%}
  body{
    margin:0;background:#fff;color:var(--ink);
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",system-ui,sans-serif;
    font-size:17px;line-height:1.6;-webkit-font-smoothing:antialiased;
  }
  main{max-width:44rem;margin:0 auto;padding:18vh 32px 8rem}
  h1{font-size:2.375rem;line-height:1.14;letter-spacing:-.02em;font-weight:700;margin:0 0 .75rem}
  .role{font-size:1.125rem;color:var(--ink-soft);margin:0 0 3.5rem}
  h2{font-size:.8125rem;text-transform:uppercase;letter-spacing:.11em;
     font-weight:700;color:var(--ink-faint);margin:0 0 1.25rem}
  ul{list-style:none;margin:0;padding:0}
  li{margin:0 0 1.5rem}
  a.work{color:var(--ink);font-size:1.1875rem;font-weight:600;
    text-decoration:underline;text-decoration-color:#bbb;
    text-underline-offset:4px;text-decoration-thickness:1px}
  a.work:hover{text-decoration-color:var(--ink)}
  .where{display:block;color:var(--ink-faint);font-size:.9375rem;margin-top:.35rem;line-height:1.45}
  @media (max-width:640px){
    main{padding:10vh 24px 6rem}
    h1{font-size:2rem}
  }
</style>
</head>
<body>
<main>
  <h1>Henrik Andersson</h1>
  <p class="role">Senior Product Designer</p>

  <ul>
    <li>
      <a class="work" href="traffic-accident-reporting/">Rebuilding traffic accident reporting for the Swedish Police</a>
      <span class="where">Main Designer, Project Lead<br>2024</span>
    </li>
  </ul>
</main>
</body>
</html>
